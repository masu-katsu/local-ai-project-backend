# ============================================
# ローカルAIアプリ Docker Compose
# ============================================

services:

  # ------------------------------------------
  # FastAPI 制御サーバー（司令塔）
  # ------------------------------------------
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: ai-fastapi
    ports:
      - "${FASTAPI_PORT:-8000}:8000"        # 外部公開ポート（Unity・スマホからアクセス）
    environment:
      - QWEN_URL=http://qwen:8002
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - API_KEY=${API_KEY:-your-secret-key}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      - LOG_DIR=/logs
      - TIME_DECAY_HALF_LIFE_DAYS=${TIME_DECAY_HALF_LIFE_DAYS:-30}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Tokyo}
    volumes:
      - ../02_logs/conversations:/logs       # 会話ログの保存先
      - ../02_logs/system:/app/logs/system   # FastAPIシステムログの保存先
    networks:
      - frontend    # 外部アクセス可能
      - backend     # 内部AI通信
    depends_on:
      qwen:
        condition: service_started
      chromadb:
        condition: service_started
    restart: unless-stopped

  # ------------------------------------------
  # Qwen 生成AI（CPU/GPU 自動切替）
  # ------------------------------------------
  qwen:
    build:
      context: ./qwen
      dockerfile: Dockerfile
    container_name: ai-qwen
    environment:
      - MODEL_PATH=/03_models/qwen/qwen2.5-1.5b-instruct-q4_k_m.gguf
      - MAX_TOKENS=${QWEN_MAX_TOKENS:-2048}
      - N_GPU_LAYERS=${QWEN_GPU_LAYERS:-0}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Tokyo}
    volumes:
      - ../03_models/qwen:/03_models/qwen:ro    # モデルファイル（読み取り専用）
    networks:
      - backend     # 内部ネットワークのみ
    restart: unless-stopped

  # ------------------------------------------
  # ChromaDB ベクトルDB（会話履歴検索用）
  # ------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: ai-chromadb
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - ../02_logs/chroma_db:/data            # データ永続化
    networks:
      - backend     # 内部ネットワークのみ
    restart: unless-stopped

# ==============================================
# ネットワーク定義
# ==============================================
networks:
  frontend:
    driver: bridge
    # FastAPIのみが参加 → 外部（Unity/スマホ）からアクセス可能

  backend:
    driver: bridge
    internal: true
    # internal: true → 外部からアクセス不可
    # FastAPI, Qwen, ChromaDB のみが通信可能
